name: Hotfix board modal timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-board-modal-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limit board modal to start and end
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          replacements = {
              '<button class="primary" id="resetBtn">New Game</button><button id="boardBtn">The Board</button><button id="sayHiBtn">Say HI!</button><button class="seed" id="seedBtn">Seed Start</button>': '<button class="primary" id="resetBtn">New Game</button><button class="seed" id="seedBtn">Seed Start</button>',
              '$("resetBtn").addEventListener("click",()=>{startGame(false,true);openBoardModal(false)});$("boardBtn").addEventListener("click",()=>openBoardModal(false));sayHiBtn.addEventListener("click",()=>{openBoardModal(false);setTimeout(()=>{hiMsgInput.focus()},80)});sayHiModalBtn.addEventListener("click",sayHi);': '$("resetBtn").addEventListener("click",()=>startGame(false,true));sayHiModalBtn.addEventListener("click",sayHi);',
              '$("playAgainBtn").addEventListener("click",()=>{restartLast();openBoardModal(false)});': '$("playAgainBtn").addEventListener("click",restartLast);',
              '$("newGameBtn").addEventListener("click",()=>{resultModal.classList.remove("show");startGame(false,true);openBoardModal(false)});': '$("newGameBtn").addEventListener("click",()=>{resultModal.classList.remove("show");startGame(false,true)});',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:120]}...')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit hotfix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-board-modal-timing.yml
          git add index.html
          git commit -m "Limit board modal to start and end"
          git push
